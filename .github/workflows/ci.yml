name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Tests
        run: bun test
      - name: Committed bundle runs on Node
        run: |
          node dist/cinesco.js providers --json | grep -q '"id":"cinemark"'
          node dist/cinesco.js doctor --json | grep -q agent-browser
          node dist/cinesco.js schema --json | grep -q '"schemaVersion"'
